# The landmark buildings: modelled one by one before the downtown run, each
# with its own building directory. scripts/run_downtown.py merges their meshes
# into the downtown tileset; scripts/intake_server.py shows them.
#
#   key           a short name
#   gers          Overture GERS id, what everything in the project is keyed on
#   building_dir  where its obliques, LiDAR, meshes and QA live
#   case          the survey case name, where it has one

landmarks:
  - key: pnc_tower
    name: PNC Tower
    gers: 1614a997-3d6f-475f-9bc5-bb5a9dbc878d
    building_dir: outputs/pnc_tower/pnc_tower
    case: pnc_tower

  - key: 400_west_market
    name: 400 West Market
    gers: df2fccca-d6bd-4d4d-b4bc-673cfb5245aa
    building_dir: outputs/urban/building_002
    case: building_002

  - key: humana
    name: Humana Building
    gers: d2786314-4fb3-4da6-8f81-621873d40c08
    building_dir: outputs/humana/humana
