<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>__NAME__ — side by side</title>
  <script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/";</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    #row { display: flex; width: 100%; height: 100%; }
    .pane { position: relative; flex: 1 1 50%; height: 100%; }
    .pane + .pane { border-left: 2px solid #fff; }
    .cesium { width: 100%; height: 100%; }
    .hud { position: absolute; top: 10px; left: 10px; z-index: 5; font: 13px system-ui, sans-serif; color: #fff;
           background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 6px; max-width: 46%; }
    .hud b { font-size: 15px; }
    .hud .muted { color: #bbb; }
    .cesium-viewer-bottom { display: none; }
    #panel { position: absolute; left: 10px; bottom: 10px; z-index: 6; width: min(46vw, 640px);
             font: 13px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.72); border-radius: 8px;
             padding: 10px 12px; display: none; }
    #panel.open { display: block; }
    #panel .title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    #panel .title b { font-size: 15px; }
    #panel .muted { color: #bbb; }
    #panel button { background: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
    #main { position: relative; margin-top: 8px; background: #111; border-radius: 4px; overflow: hidden;
            display: inline-block; max-width: 100%; }
    #main img { display: block; max-width: 100%; max-height: 42vh; width: auto; height: auto; }
    #main canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #caption { margin-top: 6px; }
    #strip { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
    #strip .thumb { flex: 0 0 auto; width: 88px; cursor: pointer; text-align: center; font-size: 11px; color: #ccc; }
    #strip .thumb img { width: 88px; height: 88px; object-fit: cover; border-radius: 3px; border: 2px solid transparent; display: block; }
    #strip .thumb.current img { border-color: #ffd23f; }
    #panel label { color: #ccc; font-size: 12px; margin-left: 8px; }
    .layer-btn { background: #222; color: #bbb; border: 1px solid #555; border-radius: 4px; padding: 3px 8px;
                 font: 11px system-ui, sans-serif; cursor: pointer; transition: all 0.15s ease; }
    .layer-btn:hover { color: #fff; border-color: #888; }
    .layer-btn.active { background: #ffd23f; color: #111; font-weight: 600; border-color: #ffd23f; }
    .north-arrow { position: absolute; top: 10px; right: 10px; z-index: 10; width: 44px; height: 44px; cursor: pointer;
                   user-select: none; background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.3);
                   border-radius: 50%; display: flex; align-items: center; justify-content: center;
                   box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
    .north-arrow:hover { background: rgba(20, 20, 20, 0.85); border-color: #ffd23f; transform: scale(1.06); }
    .north-arrow:active { transform: scale(0.95); }
    .north-needle { transform-origin: 20px 20px; transition: transform 0.05s linear; }
  </style>
</head>
<body>
  <div id="row">
    <div class="pane">
      <div class="hud">
        <b id="left-title">__LEFT_NAME__</b><br><span class="muted" id="left-info">loading…</span><br>
        <span class="muted">click a building to see the aerial frames behind it</span>
        <div class="product-row" data-pane="left" style="margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span class="muted" style="font-size: 11px;">Product:</span>
          <button class="layer-btn product-btn" data-key="1" title="Overture footprints at their LiDAR heights (measured)">1 · footprints</button>
          <button class="layer-btn product-btn" data-key="2" title="LiDAR geometry, colour only where a frame saw it (measured)">2 · measured</button>
          <button class="layer-btn product-btn" data-key="3" title="Product 2 with unseen texels invented from each building's own frames">3 · completed</button>
          <button class="layer-btn product-btn" data-key="3t" title="Product 3 with every invented texel tinted magenta">3 · invented shown</button>
          <button class="layer-btn product-btn" data-key="4" title="Product 2 with unseen texels filled by the per-building PyTorch neural facade inpainter">4 · neural</button>
          <button class="layer-btn product-btn" data-key="4t" title="Product 4 with every neural-filled texel tinted violet">4 · neural shown</button>
        </div>
        <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span class="muted" style="font-size: 11px;">Landmarks:</span>
          <button class="layer-btn" onclick="flyToLandmark('pnc')" title="Fly to PNC Tower (1614a997)">PNC Tower</button>
          <button class="layer-btn" onclick="flyToLandmark('400wm')" title="Fly to 400 West Market (df2fccca)">400 W Market</button>
          <button class="layer-btn" onclick="flyToLandmark('humana')" title="Fly to Humana Building (d2786314)">Humana</button>
          <button class="layer-btn" onclick="flyToLandmark('overview')" title="Reset to downtown overview">Overview</button>
        </div>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span class="muted" style="font-size: 11px;">Basemap:</span>
          <button id="btn-osm" class="layer-btn active" title="OpenStreetMap vector basemap">OpenStreetMap</button>
          <button id="btn-usgs" class="layer-btn" title="USGS Imagery Only basemap: tiles cut in advance, fast; mostly NAIP in the US, not always its newest year (left globe only)">USGS imagery</button>
          <span class="muted" style="font-size: 11px; margin-left: 6px;">Mesh:</span>
          <button id="btn-mesh-solid" class="layer-btn active" title="Textured solid 3D mesh">Solid</button>
          <button id="btn-mesh-wireframe" class="layer-btn" title="Wireframe mode">Wireframe</button>
        </div>
      </div>
      <div class="north-arrow" title="Click to face North (reset heading)" onclick="resetNorth()">
        <svg viewBox="0 0 40 40" width="34" height="34" style="overflow: visible;">
          <g class="north-needle">
            <polygon points="20,4 25,20 20,17" fill="#ff4444"/>
            <polygon points="20,4 15,20 20,17" fill="#ff7878"/>
            <polygon points="20,36 25,20 20,23" fill="#aaaaaa"/>
            <polygon points="20,36 15,20 20,23" fill="#ffffff"/>
            <circle cx="20" cy="20" r="2.5" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
            <text x="20" y="2" font-size="7" font-weight="bold" fill="#ff4444" text-anchor="middle" font-family="system-ui, sans-serif">N</text>
          </g>
        </svg>
      </div>
      <div id="left" class="cesium"></div>
      <div id="panel">
        <div class="title"><span><b id="p-name"></b> <span class="muted" id="p-meta"></span></span>
          <span><label><input type="checkbox" id="p-follow" checked> follow the camera</label> <button id="p-close">close</button></span></div>
        <div id="main"><img id="p-img" alt=""><canvas id="p-canvas"></canvas></div>
        <div id="caption" class="muted"></div>
        <div id="strip"></div>
      </div>
    </div>
    <div class="pane">
      <div class="hud">
        <b id="right-title">__RIGHT_NAME__</b><br><span class="muted" id="right-info">loading…</span>
        <div class="product-row" data-pane="right" style="margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span class="muted" style="font-size: 11px;">Product:</span>
          <button class="layer-btn product-btn" data-key="1" title="Overture footprints at their LiDAR heights (measured)">1 · footprints</button>
          <button class="layer-btn product-btn" data-key="2" title="LiDAR geometry, colour only where a frame saw it (measured)">2 · measured</button>
          <button class="layer-btn product-btn" data-key="3" title="Product 2 with unseen texels invented from each building's own frames">3 · completed</button>
          <button class="layer-btn product-btn" data-key="3t" title="Product 3 with every invented texel tinted magenta">3 · invented shown</button>
          <button class="layer-btn product-btn" data-key="4" title="Product 2 with unseen texels filled by the per-building PyTorch neural facade inpainter">4 · neural</button>
          <button class="layer-btn product-btn" data-key="4t" title="Product 4 with every neural-filled texel tinted violet">4 · neural shown</button>
        </div>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px;">
          <span class="muted" style="font-size: 11px;">Heights:</span>
          <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="heights" value="lidar" checked style="cursor: pointer; margin: 0; accent-color: #ffd23f;">
            LiDAR derived heights
          </label>
          <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="heights" value="overture" style="cursor: pointer; margin: 0; accent-color: #ffd23f;">
            Overture building heights
          </label>
        </div>
      </div>
      <div class="north-arrow" title="Click to face North (reset heading)" onclick="resetNorth()">
        <svg viewBox="0 0 40 40" width="34" height="34" style="overflow: visible;">
          <g class="north-needle">
            <polygon points="20,4 25,20 20,17" fill="#ff4444"/>
            <polygon points="20,4 15,20 20,17" fill="#ff7878"/>
            <polygon points="20,36 25,20 20,23" fill="#aaaaaa"/>
            <polygon points="20,36 15,20 20,23" fill="#ffffff"/>
            <circle cx="20" cy="20" r="2.5" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
            <text x="20" y="2" font-size="7" font-weight="bold" fill="#ff4444" text-anchor="middle" font-family="system-ui, sans-serif">N</text>
          </g>
        </svg>
      </div>
      <div id="right" class="cesium"></div>
    </div>
  </div>
  <script>
    Cesium.Ion.defaultAccessToken = "";
    // The ground: the LiDAR's ground returns, served as heightmap tiles by
    // /terrain (scripts/ground_dem.py). On the bare ellipsoid the map sat at
    // height zero and every building at its true ellipsoidal height, about
    // 106 m here, so from the street they hung a hundred metres over the map.
    // Outside the DEM the ground is clamped to its edge; the whole globe is
    // a plateau at the downtown's height, which is fine for a downtown view.
    // One provider per viewer (never shared between the two globes), and a
    // tile whose bytes do not come back as 32 x 32 floats -- a failed fetch,
    // a server restart -- is thrown so Cesium retries it, never handed to the
    // tessellator to choke on.
    function makeTerrain() {
      if (!__TERRAIN__) return new Cesium.EllipsoidTerrainProvider();
      return new Cesium.CustomHeightmapTerrainProvider({
        width: 32, height: 32,
        callback: async (x, y, level) => {
          const r = await fetch(`/terrain?x=${x}&y=${y}&level=${level}&w=32&h=32`);
          if (!r.ok) throw new Error(`terrain tile ${level}/${x}/${y}: ${r.status}`);
          const buf = await r.arrayBuffer();
          if (buf.byteLength !== 32 * 32 * 4) throw new Error(`terrain tile ${level}/${x}/${y}: ${buf.byteLength} bytes`);
          return new Float32Array(buf);
        },
      });
    }
    function makeViewer(id) {
      const osmLayer = new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/",
        maximumLevel: 19
      }));
      // The USGS Imagery Only basemap: the same kind of picture, as tiles cut
      // in advance, so they come back at once rather than being drawn per request.
      const usgsLayer = new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
        url: "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}",
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        maximumLevel: 18,
        credit: "USGS The National Map: Imagery Only"
      }));
      usgsLayer.show = false;

      const v = new Cesium.Viewer(id, {
        baseLayer: osmLayer,
        terrainProvider: makeTerrain(),
        geocoder: false, baseLayerPicker: false, sceneModePicker: false, navigationHelpButton: false,
        animation: false, timeline: false, homeButton: false, infoBox: false, selectionIndicator: false,
        fullscreenButton: false, contextOptions: { webgl: { preserveDrawingBuffer: true } },
      });
      // aerial imagery on the left globe only: two globes each asking for it doubled the work
      if (id === "left") {
        v.imageryLayers.add(usgsLayer);
        v._usgsLayer = usgsLayer;
      }
      v._osmLayer = osmLayer;
      v.scene.globe.depthTestAgainstTerrain = false;
      return v;
    }
    const left = makeViewer("left"), right = makeViewer("right");
    window.viewer = left;

    function setBasemap(type) {
      // the right globe (Overture) keeps OpenStreetMap; the left takes the choice
      if (left._osmLayer) left._osmLayer.show = (type === "osm");
      if (left._usgsLayer) left._usgsLayer.show = (type === "usgs");
      if (right._osmLayer) right._osmLayer.show = true;
      for (const [btn, t] of [["btn-osm", "osm"], ["btn-usgs", "usgs"]])
        document.getElementById(btn).classList.toggle("active", type === t);
    }
    document.getElementById("btn-osm").addEventListener("click", () => setBasemap("osm"));
    document.getElementById("btn-usgs").addEventListener("click", () => setBasemap("usgs"));

    // Left Mesh Mode (Solid vs Wireframe)
    let leftTilesets = [];
    let isWireframe = false;

    function setMeshMode(mode) {
      isWireframe = (mode === "wireframe");
      for (const t of leftTilesets) {
        t.debugWireframe = isWireframe;
      }
      document.getElementById("btn-mesh-solid").classList.toggle("active", !isWireframe);
      document.getElementById("btn-mesh-wireframe").classList.toggle("active", isWireframe);
      left.scene.requestRender();

      const u = new URL(window.location.href);
      if (isWireframe) u.searchParams.set("wireframe", "1");
      else u.searchParams.delete("wireframe");
      window.history.replaceState({}, "", u);
    }
    document.getElementById("btn-mesh-solid").addEventListener("click", () => setMeshMode("solid"));
    document.getElementById("btn-mesh-wireframe").addEventListener("click", () => setMeshMode("wireframe"));

    function updateNorthArrows() {
      const v = leader || left;
      const heading = v.camera.heading;
      const deg = -Cesium.Math.toDegrees(heading);
      for (const el of document.querySelectorAll(".north-needle")) {
        el.style.transform = `rotate(${deg}deg)`;
      }
    }

    function resetNorth() {
      const v = leader || left;
      const canvas = v.canvas;
      const centerScreen = new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2);
      const ray = v.camera.getPickRay(centerScreen);
      let target = v.scene.pickPositionSupported ? v.scene.pickPosition(centerScreen) : null;
      if (!target) target = v.scene.globe.pick(ray, v.scene);
      if (!target) target = v.camera.pickEllipsoid(centerScreen, v.scene.globe.ellipsoid);

      const pitch = v.camera.pitch;
      if (target) {
        const range = Cesium.Cartesian3.distance(v.camera.positionWC, target);
        const sphere = new Cesium.BoundingSphere(target, 1.0);
        v.camera.flyToBoundingSphere(sphere, {
          offset: new Cesium.HeadingPitchRange(0.0, pitch, range),
          duration: 0.5
        });
      } else {
        v.camera.flyTo({
          destination: v.camera.positionWC.clone(),
          orientation: { heading: 0.0, pitch: pitch, roll: 0.0 },
          duration: 0.5
        });
      }
    }
    window.resetNorth = resetNorth;

    // One camera, two views: the pane last touched leads, and the other
    // copies its camera every frame.
    let leader = left;
    left.canvas.addEventListener("pointerdown", () => { leader = left; });
    right.canvas.addEventListener("pointerdown", () => { leader = right; });
    left.canvas.addEventListener("wheel", () => { leader = left; }, { passive: true });
    right.canvas.addEventListener("wheel", () => { leader = right; }, { passive: true });
    function copyCamera(from, to) {
      to.camera.setView({ destination: from.camera.positionWC,
                          orientation: { direction: from.camera.directionWC, up: from.camera.upWC } });
    }
    left.scene.preRender.addEventListener(() => {
      if (leader === left) copyCamera(left, right);
      updateNorthArrows();
    });
    right.scene.preRender.addEventListener(() => {
      if (leader === right) copyCamera(right, left);
      updateNorthArrows();
    });
    async function load(viewer, urls, infoId, isLeft = false) {
      const loaded = [];
      let triangles = 0, points = 0, buildings = 0;
      for (const url of urls) {
        const t = await Cesium.Cesium3DTileset.fromUrl(url, {
          maximumScreenSpaceError: 4,
          enableDebugWireframe: true,
        });
        if (isLeft && isWireframe) {
          t.debugWireframe = true;
        }
        t.style = new Cesium.Cesium3DTileStyle({ pointSize: "3" });
        viewer.scene.primitives.add(t);
        triangles += (t.extras && t.extras.triangles) || 0;
        points += (t.extras && t.extras.points) || 0;
        buildings += (t.extras && t.extras.buildings) || 1;
        loaded.push(t);
      }
      const bits = [];
      if (triangles) bits.push(`${triangles.toLocaleString()} textured triangles`);
      if (points) bits.push(`${points.toLocaleString()} points`);
      const h = loaded[0] && loaded[0].extras && loaded[0].extras.heights;
      if (h) bits.push(h.lidar
        ? `${buildings} boxes: ${h.lidar} at the LiDAR's height, ${h.height + h.floors + h.default} without enough returns (Overture's height or a guess)`
        : `${buildings} boxes: ${h.height} with a height, ${h.floors} from a floor count, ${h.default} guessed`);
      document.getElementById(infoId).textContent = bits.join(" · ") || `${loaded.length} tileset(s)`;
      return loaded;
    }
    // Frame a point: lookAt, then re-set the same view without the lookAt
    // transform -- a lookAt alone sometimes leaves the first frame black.
    function frame(target, headingDeg, pitchDeg, range) {
      left.camera.lookAt(target, new Cesium.HeadingPitchRange(Cesium.Math.toRadians(headingDeg), Cesium.Math.toRadians(pitchDeg), range));
      left.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
      left.camera.setView({ destination: left.camera.positionWC.clone(),
                            orientation: { direction: left.camera.directionWC.clone(), up: left.camera.upWC.clone() } });
    }
    const LANDMARK_VIEWS = {
      pnc:    { lon: -85.75795, lat: 38.25620, h: 175, heading: 215, pitch: -16, range: 210, gers: "1614a997-3d6f-475f-9bc5-bb5a9dbc878d" },
      "400wm":{ lon: -85.75715, lat: 38.25497, h: 185, heading: 225, pitch: -18, range: 240, gers: "df2fccca-d6bd-4d4d-b4bc-673cfb5245aa" },
      humana: { lon: -85.75873, lat: 38.25645, h: 160, heading: 145, pitch: -16, range: 200, gers: "d2786314-4fb3-4da6-8f81-621873d40c08" },
    };
    function flyToLandmark(key) {
      leader = left;
      if (key === "overview" && window.center) {
        frame(window.center, 225, -20, window.overviewRange || 1400);
        return;
      }
      const v = LANDMARK_VIEWS[key];
      if (!v) return;
      const target = Cesium.Cartesian3.fromDegrees(v.lon, v.lat, v.h);
      frame(target, v.heading, v.pitch, v.range);
    }
    window.flyToLandmark = flyToLandmark;
    async function snapshot(name) {
      left.render(); right.render();
      const c = document.createElement("canvas");
      c.width = left.canvas.width + right.canvas.width; c.height = Math.max(left.canvas.height, right.canvas.height);
      const g = c.getContext("2d");
      g.drawImage(left.canvas, 0, 0); g.drawImage(right.canvas, left.canvas.width, 0);
      const r = await fetch(`/snapshot?name=${encodeURIComponent(name)}`, { method: "POST", body: c.toDataURL("image/jpeg", 0.9) });
      return r.json();
    }
    // ---------------------------------------------------------------- obliques
    // Click a building: find its GERS (the tile's extras, else the point
    // under the click looked up on the server), fetch its frames, and show
    // the one whose look direction is nearest the viewer's own.
    const panel = document.getElementById("panel");
    let current = null;                      // {gers, name, frames, ...}
    let currentIndex = -1;
    let outline = [];                        // entities on both globes
    function armClicks(v) {
      // Cesium's own handler: a LEFT_CLICK is a press and release without a drag.
      const h = new Cesium.ScreenSpaceEventHandler(v.canvas);
      h.setInputAction(async (click) => {
        const pos = click.position;
        const p = v.scene.pick(pos);
        const tile = p && p.content && p.content.tile;
        if (tile && tile.extras && tile.extras.gers) return showBuilding(tile.extras.gers, v);
        let cart = v.scene.pickPositionSupported ? v.scene.pickPosition(pos) : undefined;
        if (!cart) cart = v.camera.pickEllipsoid(pos, v.scene.globe.ellipsoid);
        if (!cart) return;
        const c = Cesium.Cartographic.fromCartesian(cart);
        const r = await fetch(`/building_at?lon=${Cesium.Math.toDegrees(c.longitude)}&lat=${Cesium.Math.toDegrees(c.latitude)}`).then((x) => x.json());
        if (r.gers) showBuilding(r.gers, v);
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }
    armClicks(left); armClicks(right);

    // The viewer's look direction in the building's east-north-up frame.
    function lookENU(v, ring) {
      const [lon, lat] = ring[0];
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(lon, lat));
      const inv = Cesium.Matrix4.inverseTransformation(enu, new Cesium.Matrix4());
      const d = Cesium.Matrix4.multiplyByPointAsVector(inv, v.camera.directionWC, new Cesium.Cartesian3());
      return [d.x, d.y, d.z];
    }
    function scored(rec, v) {
      const d = lookENU(v, rec.ring_lonlat);
      return rec.frames.map((f) => {
        const dot = d[0] * f.look_enu[0] + d[1] * f.look_enu[1] + d[2] * f.look_enu[2];
        return { f, off: Cesium.Math.toDegrees(Math.acos(Math.max(-1, Math.min(1, dot)))) };
      }).sort((a, b) => a.off - b.off);
    }
    function drawOutline(f) {
      const img = document.getElementById("p-img"), cv = document.getElementById("p-canvas");
      if (!img.naturalWidth) return;
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const s = img.naturalWidth / f.width_px;
      const g = cv.getContext("2d");
      g.clearRect(0, 0, cv.width, cv.height);
      g.lineWidth = Math.max(2, 3 * s);
      const ring = (pts, colour) => {
        g.strokeStyle = colour; g.beginPath();
        pts.forEach(([u, vv], i) => (i ? g.lineTo(u * s, vv * s) : g.moveTo(u * s, vv * s)));
        g.closePath(); g.stroke();
      };
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = Math.max(1, 1.5 * s);
      f.base_px.forEach((b, i) => { const r = f.roof_px[i]; g.beginPath(); g.moveTo(b[0] * s, b[1] * s); g.lineTo(r[0] * s, r[1] * s); g.stroke(); });
      ring(f.base_px, "#ffd23f"); ring(f.roof_px, "#3fd6ff");
    }
    function showFrame(i, off) {
      const f = current.frames[i];
      currentIndex = i;
      const img = document.getElementById("p-img");
      document.getElementById("caption").textContent = `cutting from the frame…`;
      img.onload = () => {
        drawOutline(f);
        const where = f.nadir ? "straight down" : `looks ${Math.round(f.azimuth_deg)}°, ${Math.round(f.elevation_deg)}° down`;
        document.getElementById("caption").textContent =
          `${f.head} head · ${f.frame_id.split("/").pop()} · ${where} · ${Math.round(off)}° off your view · crop ${f.width_px} px`;
      };
      img.src = `/crop?gers=${current.gers}&frame=${i}&max=1600`;
      for (const el of document.querySelectorAll("#strip .thumb")) el.classList.toggle("current", +el.dataset.index === i);
    }
    function refreshBest(v) {
      if (!current || !document.getElementById("p-follow").checked) return;
      const s = scored(current, v || left);
      if (s[0].f.index !== currentIndex) showFrame(s[0].f.index, s[0].off);
      else document.querySelectorAll("#strip .thumb").forEach((el) => {
        const e = s.find((x) => x.f.index === +el.dataset.index); el.querySelector("span").textContent = `${e.f.head} · ${Math.round(e.off)}°`;
      });
    }
    async function showBuilding(gers, v) {
      const rec = await fetch(`/frames?gers=${gers}`).then((x) => x.ok ? x.json() : null);
      if (!rec) return;
      current = rec; currentIndex = -1;
      document.getElementById("p-name").textContent = rec.name;
      document.getElementById("p-meta").textContent =
        `${rec.gers.slice(0, 8)} · ${rec.frames.length} frames · ${rec.path || "landmark"} · ${Math.round(rec.height_m)} m`;
      const s = scored(rec, v || left);
      const strip = document.getElementById("strip"); strip.innerHTML = "";
      for (const { f, off } of s) {
        const el = document.createElement("div"); el.className = "thumb"; el.dataset.index = f.index;
        el.innerHTML = `<img src="/crop?gers=${rec.gers}&frame=${f.index}&max=320" alt=""><span>${f.head} · ${Math.round(off)}°</span>`;
        el.onclick = () => { document.getElementById("p-follow").checked = false; showFrame(f.index, off); };
        strip.appendChild(el);
      }
      panel.classList.add("open");
      showFrame(s[0].f.index, s[0].off);
      // the footprint on both globes
      outline.forEach((e) => e.owner.entities.remove(e.entity)); outline = [];
      const flat = rec.ring_lonlat.flat();
      for (const vw of [left, right]) {
        const entity = vw.entities.add({ polyline: { positions: Cesium.Cartesian3.fromDegreesArray(flat), clampToGround: true,
                                                      classificationType: Cesium.ClassificationType.TERRAIN,
                                                      width: 3, material: Cesium.Color.fromCssColorString("#ffd23f") } });
        outline.push({ owner: vw, entity });
      }
    }
    document.getElementById("p-close").onclick = () => {
      panel.classList.remove("open"); current = null;
      outline.forEach((e) => e.owner.entities.remove(e.entity)); outline = [];
    };
    left.camera.moveEnd.addEventListener(() => refreshBest(left));
    right.camera.moveEnd.addEventListener(() => refreshBest(right));
    window.showBuilding = showBuilding;
    let rightTilesets = [];

    // the three products (docs/PRODUCTS.md), each pane showing any one
    const PRODUCTS = __PRODUCTS__;
    const paneProduct = { left: __LEFT_PRODUCT__, right: __RIGHT_PRODUCT__ };
    function markProducts() {
      for (const row of document.querySelectorAll(".product-row")) {
        const pane = row.dataset.pane;
        for (const b of row.querySelectorAll(".product-btn")) {
          const k = b.dataset.key;
          b.disabled = !(PRODUCTS[k] && PRODUCTS[k].url);
          b.style.opacity = b.disabled ? "0.35" : "1";
          b.classList.toggle("active", paneProduct[pane] === k);
        }
      }
    }
    async function showProduct(pane, key) {
      const p = PRODUCTS[key];
      if (!p || !p.url) return;
      const viewer = pane === "left" ? left : right;
      const current = pane === "left" ? leftTilesets : rightTilesets;
      for (const t of current) viewer.scene.primitives.remove(t);
      document.getElementById(`${pane}-info`).textContent = "loading…";
      document.getElementById(`${pane}-title`).textContent = p.title;
      let loaded = [];
      try {
        loaded = await load(viewer, [p.url], `${pane}-info`, pane === "left");
      } catch (e) {
        document.getElementById(`${pane}-info`).textContent = "failed: " + e.message;
      }
      if (pane === "left") leftTilesets = loaded; else rightTilesets = loaded;
      paneProduct[pane] = key;
      markProducts();
      const u = new URL(window.location);
      u.searchParams.set(`${pane}_product`, key);
      window.history.replaceState({}, "", u);
    }
    for (const b of document.querySelectorAll(".product-btn")) {
      b.addEventListener("click", () => showProduct(b.closest(".product-row").dataset.pane, b.dataset.key));
    }

    async function switchHeights(type) {
      const url = (type === "overture")
        ? "/files/outputs/overture_boxes/downtown/tileset.json"
        : "/files/outputs/overture_boxes/downtown_lidar/tileset.json";
      const title = (type === "overture")
        ? "Overture buildings, extruded to their height"
        : "Overture footprints at the LiDAR's heights";

      for (const t of rightTilesets) {
        right.scene.primitives.remove(t);
      }
      rightTilesets = [];
      document.getElementById("right-info").textContent = "loading…";
      const titleEl = document.getElementById("right-title");
      if (titleEl) titleEl.textContent = title;

      try {
        rightTilesets = await load(right, [url], "right-info");
      } catch (e) {
        document.getElementById("right-info").textContent = "failed: " + e.message;
      }

      paneProduct.right = type === "overture" ? "1o" : "1";
      markProducts();
      const u = new URL(window.location);
      u.searchParams.set("heights", type);
      u.searchParams.delete("right_product");
      window.history.replaceState({}, "", u);
    }

    const currentHeights = new URLSearchParams(window.location.search).get("heights") || "lidar";
    const initialRadio = document.querySelector(`input[name="heights"][value="${currentHeights}"]`);
    if (initialRadio) initialRadio.checked = true;

    document.querySelectorAll('input[name="heights"]').forEach((el) => {
      el.addEventListener("change", (e) => {
        if (e.target.checked) switchHeights(e.target.value);
      });
    });

    (async () => {
      try {
        const lp = paneProduct.left, rp = paneProduct.right;
        leftTilesets = await load(left, (lp && PRODUCTS[lp] && PRODUCTS[lp].url) ? [PRODUCTS[lp].url] : __LEFT__, "left-info", true);
        rightTilesets = await load(right, (rp && PRODUCTS[rp] && PRODUCTS[rp].url) ? [PRODUCTS[rp].url] : __RIGHT__, "right-info", false);
        if (lp && PRODUCTS[lp]) document.getElementById("left-title").textContent = PRODUCTS[lp].title;
        if (rp && PRODUCTS[rp]) document.getElementById("right-title").textContent = PRODUCTS[rp].title;
        markProducts();
        const params = new URLSearchParams(window.location.search);
        if (params.get("wireframe") === "1" || params.get("wireframe") === "true") {
          setMeshMode("wireframe");
        }
        const centers = leftTilesets.map((t) => t.boundingSphere.center);
        const center = centers.reduce((a, c) => Cesium.Cartesian3.add(a, c, a), new Cesium.Cartesian3());
        Cesium.Cartesian3.divideByScalar(center, centers.length, center);
        const radius = Math.max(...leftTilesets.map((t) => Cesium.Cartesian3.distance(center, t.boundingSphere.center) + t.boundingSphere.radius));
        window.center = center;
        window.overviewRange = radius * 2.4;
        const lm = params.get("landmark");
        if (lm && LANDMARK_VIEWS[lm]) {
          flyToLandmark(lm);
        } else {
          frame(center, 225, -20, radius * 2.4);
        }
      } catch (e) {
        document.getElementById("left-info").textContent = "failed: " + e.message;
      }
    })();
  </script>
</body>
</html>
