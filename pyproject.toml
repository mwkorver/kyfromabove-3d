[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kyfromabove-3d"
version = "0.1.0"
description = "Kentucky in 3D from KyFromAbove: building meshes from the LiDAR and aerial frames, on Overture footprints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    # laspy reads and writes compressed LAZ only with a backend; lazrs is the one
    # the tests and the cloud steps use
    "laspy[lazrs]",
    "opencv-python",
    "pillow",
    "boto3",
    "pyyaml",
    # kyfromabove_3d.plots is part of the package and imports it at module
    # level; it was in use long before it was declared.
    "matplotlib",
]

[project.optional-dependencies]

# duckdb queries Overture's GeoParquet on S3 with predicate pushdown (stage 0,
# stages.overture_boxes): the buildings theme is 257 GiB, so a bbox query
# against the remote files is the only practical route. It also writes the map
# file of the published tiles (tile_index), with its spatial extension. Only
# the laptop steps import it, lazily; the cloud image does not carry it yet.
# The Kentucky attribute-coverage measurement it made:
#
#   Overture 2026-08-19.0, Kentucky bbox, 5,294,866 buildings
#     height 71.8%  class 10.2%  num_floors 2.7%  roof_shape 0.1%
#
#   ...and roof_shape only reaches 0.4% on buildings over 5,000 m2, so it is
#   not a routing signal at any size.
overture = ["duckdb"]

# the cloud stages: the CDK stack (needs Node for its CLI) and the tests'
# mocked AWS (moto, with its server for the container test)
cloud = ["aws-cdk-lib>=2.150", "constructs>=10", "moto[s3,sqs,dynamodb,events,server]>=5"]

# the tests and the checker; `uv sync` installs them with the project
[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = [
    "data: needs the downtown outputs on disk (scripts/audit_reference.py rebuild); run with pytest -m data",
]

# Real errors only -- undefined names, unused imports and variables, syntax
# (pyflakes and E9). No style rules and no `ruff format`: the code lines its
# comments up by hand.
[tool.ruff]
extend-exclude = ["deploy/cdk.out", "viewers/vcmap/node_modules", "viewers/vcmap/dist"]

[tool.ruff.lint]
select = ["F", "E9"]
