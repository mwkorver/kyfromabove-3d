# A strategy per class of building (scripts/classify_buildings.py writes each
# building's class to its folder, building_class.json). A class with no entry
# here is built as every building was before classes. Each class is developed
# on its development buildings and kept only if its held-out buildings agree
# (outputs/classes/split_<class>.json).
#
# upper_levels: roof_edge -- every wall of an upper level (its outline traced
#   from the LiDAR's roof) is under a measured roof edge: unseen bands, sloped
#   ones holding the wall's line and open ones over a roof are drawn
#   (features.fill_under_roof_edge), and an unseen one takes no twin's depth.
# tower_foot: down_to_roof -- an upper level's lowest wall reaches down to the
#   roof beside it where that is lower than the level's foot.
# outline: lidar -- the class is built on its LiDAR outline (footprint_lidar.json,
#   lidar_outline.py), and every edge whose roof end the LiDAR found gets the
#   roof-edge rule, as with --lidar-outline.
# party_walls: whole -- a face that is a party wall over half its length or
#   more is drawn on the outline from the ground to the roof's edge, plain up
#   to the neighbour's roof and textured above it, whatever the colourise saw
#   on it: in the middle of a row what the LiDAR catches on a party wall is
#   usually a light well 6-7 m in, not the party wall.

row2o/mid:
  party_walls: whole

row2o/tall:
  party_walls: whole

tiered/mid:
  party_walls: whole
  # upper_levels / tower_foot: on again (2026-10-14) once the tiers are traced
  # like the towers (straighten, below) and a face looks in at most 45% of
  # its level's width; the 1 m tiers and the fixed 8 m window had made it worse
  # on the development set. With both: development 5,231 -> 4,621 m2, held
  # out 7,189 -> 6,410 m2 (holes over the nine views).
  upper_levels: roof_edge
  tower_foot: down_to_roof
  # levels: the upper body is what stands above the midpoint between the roof's
  # two highest tiers, 4 m or more apart; the tower settings (12 m, 150 m2,
  # 70% cover) found an upper level on 2 of the class's 29 development buildings
  levels:
    from_tiers: true
    min_step_m: 4.0
    min_area_m2: 50.0
    max_cover: 0.9
    # traced as the towers are: 0.5 m, smoothed by 1 m, straightened, clipped to the footprint
    straighten: true

tiered/tall:
  upper_levels: roof_edge
  tower_foot: down_to_roof

box/tall:
  outline: lidar

# A footprint the LiDAR shows no building on (under 40 m2, under 2.5 m, or under
# 30% roof): from 150 m2 up, a box at its recorded height coloured from the
# frames, in the completed product only (Hotel Bourre Bonne, built after the
# LiDAR was flown); smaller ones (kiosks, grass) are built as before.
none:
  lidar: absent
  min_area_m2: 150
